<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3efe7">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f4d3a'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='18' font-family='Georgia,serif' fill='%23f4fff8'%3E$%3C/text%3E%3C/svg%3E">
  <title>Tip calculator</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("tip-calc-theme");
        var theme = stored === "dark" || stored === "light"
          ? stored
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (err) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3efe7;
      --bg-glow: rgba(31, 77, 58, 0.14);
      --bg-glow-2: rgba(196, 122, 64, 0.16);
      --surface: #fffdf9;
      --surface-2: #f7f1e6;
      --text: #1c1915;
      --muted: #5c554c;
      --line: #e4dccf;
      --accent: #1f4d3a;
      --accent-ink: #f4fff8;
      --hero: #17382b;
      --hero-text: #f4fff8;
      --hero-muted: rgba(244, 255, 248, 0.84);
      --shadow: 0 24px 60px rgba(48, 38, 22, 0.08);
      --radius: 24px;
      --focus: #c47a40;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #121410;
      --bg-glow: rgba(157, 222, 184, 0.12);
      --bg-glow-2: rgba(196, 122, 64, 0.12);
      --surface: #1c1f1a;
      --surface-2: #242822;
      --text: #f3efe7;
      --muted: #b7b0a4;
      --line: #34382f;
      --accent: #9ddeb8;
      --accent-ink: #102018;
      --hero: #9ddeb8;
      --hero-text: #102018;
      --hero-muted: rgba(16, 32, 24, 0.78);
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      --focus: #e2b07a;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 480px at 0% -10%, var(--bg-glow), transparent 55%),
        radial-gradient(700px 420px at 100% 0%, var(--bg-glow-2), transparent 50%),
        var(--bg);
      line-height: 1.45;
    }

    button, input { font: inherit; color: inherit; }

    button {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      width: min(960px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
      font-size: clamp(2.1rem, 4vw, 3.2rem);
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 1.05;
    }

    .lede {
      margin: 10px 0 0;
      max-width: 38ch;
      color: var(--muted);
    }

    .theme-toggle {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .theme-toggle svg {
      width: 22px;
      height: 22px;
    }

    .icon-sun { display: none; }

    [data-theme="dark"] .icon-moon { display: none; }
    [data-theme="dark"] .icon-sun { display: block; }

    .layout {
      display: grid;
      gap: 16px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    form {
      padding: 22px;
      display: grid;
      gap: 18px;
    }

    .field { display: grid; gap: 8px; }

    label {
      font-size: 0.92rem;
      font-weight: 700;
    }

    .control {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 56px;
      padding: 0 16px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 16px;
    }

    .control:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent);
    }

    .affix {
      color: var(--muted);
      font-weight: 700;
    }

    input[type="number"] {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: none;
      background: transparent;
      font-size: 1.35rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      -moz-appearance: textfield;
      appearance: textfield;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .quick {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .quick button {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface-2);
      font-weight: 700;
    }

    .quick button.is-active {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    @media (hover: hover) {
      .theme-toggle:hover,
      .quick button:hover,
      .stepper button:hover {
        border-color: var(--accent);
      }

      .quick button.is-active:hover {
        filter: brightness(1.08);
      }
    }

    .stepper {
      display: grid;
      grid-template-columns: 56px 1fr 56px;
      gap: 8px;
      align-items: center;
    }

    .stepper button {
      height: 56px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface-2);
      font-size: 1.5rem;
      line-height: 1;
    }

    .stepper button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .stepper input { text-align: center; }

    .hint {
      margin: 0;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .results {
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--hero) 92%, white), var(--hero));
      color: var(--hero-text);
      border: 0;
    }

    .results-kicker,
    .stat-label {
      margin: 0;
      color: var(--hero-muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .results-label {
      margin: 14px 0 0;
      font-size: 1rem;
      font-weight: 700;
    }

    .results-hero {
      margin: 4px 0 0;
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
      font-size: clamp(3rem, 8vw, 4.4rem);
      font-weight: 500;
      letter-spacing: -0.045em;
      line-height: 0.95;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    .stat-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: auto;
    }

    .stat {
      padding: 14px;
      border-radius: 16px;
      background: color-mix(in srgb, var(--hero-text) 10%, transparent);
    }

    .stat-value {
      margin: 4px 0 0;
      font-size: clamp(1.25rem, 3vw, 1.6rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .control input:focus-visible { outline: none; }

    @media (min-width: 800px) {
      .app { padding-top: 56px; }
      .layout {
        grid-template-columns: 1.05fr 0.95fr;
        gap: 20px;
        align-items: stretch;
      }
      form, .results { padding: 28px; }
      .results { min-height: 100%; }
    }

    @media (max-width: 380px) {
      .app { width: min(960px, calc(100% - 20px)); }
      .quick { grid-template-columns: repeat(2, 1fr); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">Split the check</p>
        <h1>Tip calculator</h1>
        <p class="lede">Enter the bill, choose a tip, and see what everyone owes. Totals update as you type.</p>
      </div>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark mode">
        <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M16.6 3.2a8.7 8.7 0 1 0 4.2 14.8A8.1 8.1 0 0 1 16.6 3.2z"/>
        </svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" fill="currentColor"/>
          <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6"/>
          </g>
        </svg>
      </button>
    </header>

    <div class="layout">
      <section class="panel" aria-labelledby="inputs-title">
        <h2 id="inputs-title" class="visually-hidden">Bill details</h2>
        <form id="calc" autocomplete="off">
          <div class="field">
            <label for="bill">Bill amount</label>
            <div class="control">
              <span class="affix" aria-hidden="true">$</span>
              <input id="bill" name="bill" type="number" inputmode="decimal" min="0" max="1000000" step="0.01" placeholder="0.00" aria-describedby="bill-hint">
            </div>
            <p id="bill-hint" class="hint">Before tip. Dollars and cents.</p>
          </div>

          <div class="field">
            <label for="tip">Tip percent</label>
            <div class="control">
              <input id="tip" name="tip" type="number" inputmode="decimal" min="0" max="1000" step="0.1" value="15" aria-describedby="tip-hint">
              <span class="affix" aria-hidden="true">%</span>
            </div>
            <div class="quick" role="group" aria-label="Quick tip percentages">
              <button type="button" data-tip="10" aria-pressed="false">10%</button>
              <button type="button" data-tip="15" class="is-active" aria-pressed="true">15%</button>
              <button type="button" data-tip="20" aria-pressed="false">20%</button>
              <button type="button" data-tip="25" aria-pressed="false">25%</button>
            </div>
            <p id="tip-hint" class="hint">Use a quick rate or type your own.</p>
          </div>

          <div class="field">
            <label for="people">Number of people</label>
            <div class="stepper">
              <button id="people-dec" type="button" aria-label="Decrease number of people">−</button>
              <div class="control">
                <input id="people" name="people" type="number" inputmode="numeric" min="1" max="999" step="1" value="2">
              </div>
              <button id="people-inc" type="button" aria-label="Increase number of people">+</button>
            </div>
          </div>
        </form>
      </section>

      <section class="panel results" aria-live="polite">
        <div>
          <p class="results-kicker" id="each-meta">Split 2 ways</p>
          <p class="results-label">Per person</p>
          <p class="results-hero" id="each-amount">$0.00</p>
        </div>
        <div class="stat-row">
          <div class="stat">
            <p class="stat-label" id="tip-label">Tip · 15%</p>
            <p class="stat-value" id="tip-amount">$0.00</p>
          </div>
          <div class="stat">
            <p class="stat-label">Total</p>
            <p class="stat-value" id="total-amount">$0.00</p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    (function () {
      var root = document.documentElement;
      var form = document.getElementById("calc");
      var billInput = document.getElementById("bill");
      var tipInput = document.getElementById("tip");
      var peopleInput = document.getElementById("people");
      var tipButtons = Array.prototype.slice.call(document.querySelectorAll("[data-tip]"));
      var peopleDec = document.getElementById("people-dec");
      var peopleInc = document.getElementById("people-inc");
      var tipOut = document.getElementById("tip-amount");
      var tipLabel = document.getElementById("tip-label");
      var totalOut = document.getElementById("total-amount");
      var eachOut = document.getElementById("each-amount");
      var eachMeta = document.getElementById("each-meta");
      var themeBtn = document.getElementById("theme-toggle");
      var themeMeta = document.querySelector('meta[name="theme-color"]');
      var STORAGE_KEY = "tip-calc-theme";
      var money = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });

      function clamp(value, min, max) {
        return Math.min(max, Math.max(min, value));
      }

      function parseAmount(value) {
        var number = parseFloat(value);
        return Number.isFinite(number) ? number : 0;
      }

      function readBill() {
        return clamp(parseAmount(billInput.value), 0, 1000000);
      }

      function readTip() {
        return clamp(parseAmount(tipInput.value), 0, 1000);
      }

      function readPeople() {
        var number = parseInt(peopleInput.value, 10);
        if (!Number.isFinite(number)) return 1;
        return clamp(number, 1, 999);
      }

      function formatPercent(percent) {
        var rounded = Math.round(percent * 10) / 10;
        return (rounded % 1 === 0 ? String(rounded.toFixed(0)) : String(rounded)) + "%";
      }

      function render() {
        var billCents = Math.round(readBill() * 100);
        var tipPercent = readTip();
        var people = readPeople();
        var tipCents = Math.round(billCents * tipPercent / 100);
        var totalCents = billCents + tipCents;
        var eachCents = Math.round(totalCents / people);

        tipLabel.textContent = "Tip · " + formatPercent(tipPercent);
        tipOut.textContent = money.format(tipCents / 100);
        totalOut.textContent = money.format(totalCents / 100);
        eachOut.textContent = money.format(eachCents / 100);
        eachMeta.textContent = people === 1 ? "For 1 person" : "Split " + people + " ways";

        tipButtons.forEach(function (button) {
          var active = Number(button.getAttribute("data-tip")) === tipPercent;
          button.classList.toggle("is-active", active);
          button.setAttribute("aria-pressed", active ? "true" : "false");
        });

        peopleDec.disabled = people <= 1;
        peopleInc.disabled = people >= 999;
      }

      function keepInRange(input, min) {
        if (input.value.trim() === "") return;
        var number = parseFloat(input.value);
        if (Number.isFinite(number) && number < min) input.value = String(min);
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
      });

      billInput.addEventListener("input", function () {
        keepInRange(billInput, 0);
        render();
      });

      tipInput.addEventListener("input", function () {
        keepInRange(tipInput, 0);
        render();
      });

      peopleInput.addEventListener("input", function () {
        if (peopleInput.value === "0") peopleInput.value = "1";
        if (peopleInput.value !== "" && parseInt(peopleInput.value, 10) > 999) {
          peopleInput.value = "999";
        }
        render();
      });

      peopleInput.addEventListener("blur", function () {
        peopleInput.value = String(readPeople());
        render();
      });

      tipButtons.forEach(function (button) {
        button.addEventListener("click", function () {
          tipInput.value = button.getAttribute("data-tip");
          render();
        });
      });

      peopleDec.addEventListener("click", function () {
        peopleInput.value = String(Math.max(1, readPeople() - 1));
        render();
      });

      peopleInc.addEventListener("click", function () {
        peopleInput.value = String(Math.min(999, readPeople() + 1));
        render();
      });

      function applyTheme(theme) {
        var dark = theme === "dark";
        root.setAttribute("data-theme", dark ? "dark" : "light");
        themeBtn.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
        themeBtn.setAttribute("aria-pressed", dark ? "true" : "false");
        if (themeMeta) themeMeta.setAttribute("content", dark ? "#121410" : "#f3efe7");
      }

      themeBtn.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        try {
          localStorage.setItem(STORAGE_KEY, next);
        } catch (err) {
          /* Preference simply won't persist if storage is blocked. */
        }
        applyTheme(next);
      });

      var media = window.matchMedia("(prefers-color-scheme: dark)");
      if (media.addEventListener) {
        media.addEventListener("change", function (event) {
          var stored = null;
          try {
            stored = localStorage.getItem(STORAGE_KEY);
          } catch (err) {
            stored = null;
          }
          if (stored === "dark" || stored === "light") return;
          applyTheme(event.matches ? "dark" : "light");
        });
      }

      applyTheme(root.getAttribute("data-theme") === "dark" ? "dark" : "light");
      render();
    })();
  </script>
</body>
</html>
