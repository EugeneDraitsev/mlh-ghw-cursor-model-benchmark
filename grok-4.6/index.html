<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Tip Calculator</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --bg-accent: #ece6d9;
      --surface: #fffcf7;
      --surface-2: #f7f1e6;
      --ink: #1c1917;
      --muted: #78716c;
      --line: rgba(28, 25, 23, 0.1);
      --accent: #0f766e;
      --accent-soft: #ccfbf1;
      --accent-ink: #134e4a;
      --shadow: 0 24px 60px rgba(28, 25, 23, 0.08);
      --ok: #0f766e;
      --danger: #b91c1c;
      --radius: 22px;
      --pad: clamp(1.1rem, 3vw, 1.6rem);
    }

    [data-theme="dark"] {
      --bg: #0f1115;
      --bg-accent: #171b22;
      --surface: #1a1f28;
      --surface-2: #222834;
      --ink: #f5f0e8;
      --muted: #a8a29e;
      --line: rgba(245, 240, 232, 0.1);
      --accent: #2dd4bf;
      --accent-soft: rgba(45, 212, 191, 0.14);
      --accent-ink: #99f6e4;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      --ok: #2dd4bf;
      --danger: #fca5a5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 10% -10%, var(--bg-accent), transparent 55%),
        radial-gradient(900px 400px at 110% 10%, var(--accent-soft), transparent 50%),
        var(--bg);
      line-height: 1.45;
      padding: max(1rem, env(safe-area-inset-top)) 1rem max(1.5rem, env(safe-area-inset-bottom));
    }

    .wrap {
      width: min(560px, 100%);
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.6rem 0.2rem 1.15rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: #fff;
      box-shadow: 0 8px 18px rgba(15, 118, 110, 0.28);
    }

    [data-theme="dark"] .logo {
      color: #042f2e;
      box-shadow: 0 8px 18px rgba(45, 212, 191, 0.18);
    }

    h1 {
      font-size: 1.15rem;
      letter-spacing: -0.03em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .theme-toggle {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .theme-toggle:hover {
      transform: translateY(-1px);
    }

    .theme-toggle:focus-visible,
    input:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .icon-moon { display: none; }
    [data-theme="dark"] .icon-sun { display: none; }
    [data-theme="dark"] .icon-moon { display: block; }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: var(--pad);
    }

    .stack {
      display: grid;
      gap: 1.15rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 650;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.45rem;
    }

    .field {
      position: relative;
    }

    .prefix, .suffix {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-weight: 650;
      pointer-events: none;
    }

    .prefix { left: 0.95rem; }
    .suffix { right: 0.95rem; }

    input[type="number"] {
      width: 100%;
      appearance: textfield;
      -moz-appearance: textfield;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--ink);
      border-radius: 16px;
      padding: 0.95rem 2.4rem;
      font: inherit;
      font-size: 1.2rem;
      font-variant-numeric: tabular-nums;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .chips {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      margin-top: 0.65rem;
    }

    .chip, .stepper {
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--ink);
      border-radius: 14px;
      min-height: 44px;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .stepper {
      width: 48px;
      font-size: 1.25rem;
    }

    .chip.active {
      background: var(--accent);
      border-color: transparent;
      color: #fff;
    }

    [data-theme="dark"] .chip.active {
      color: #042f2e;
    }

    .people-row {
      display: grid;
      grid-template-columns: 48px 1fr 48px;
      gap: 0.55rem;
      align-items: center;
    }

    .people-row input {
      text-align: center;
      padding-left: 0.8rem;
      padding-right: 0.8rem;
    }

    .results {
      display: grid;
      gap: 0.7rem;
      background:
        linear-gradient(180deg, var(--accent-soft), transparent 70%),
        var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 1rem;
    }

    .result {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 1rem;
    }

    .result span {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .result strong {
      font-size: 1.2rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.03em;
    }

    .result.total {
      padding-top: 0.7rem;
      border-top: 1px dashed var(--line);
    }

    .result.total strong {
      font-size: 1.55rem;
      color: var(--accent-ink);
    }

    .hint {
      min-height: 1.2rem;
      font-size: 0.85rem;
      color: var(--danger);
    }

    @media (max-width: 420px) {
      .chips {
        grid-template-columns: repeat(2, 1fr);
      }

      h1 { font-size: 1.05rem; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M5 8.5C5 6 7.5 4 12 4s7 2 7 4.5c0 5.5-7 11.5-7 11.5S5 14 5 8.5Z" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="12" cy="9" r="1.6" fill="currentColor"/>
          </svg>
        </div>
        <div>
          <h1>Tip Calculator</h1>
          <p class="subtitle">Split the bill in a few taps</p>
        </div>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M19 13.5A7.5 7.5 0 1 1 10.5 5 6 6 0 0 0 19 13.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <main class="card">
      <form class="stack" id="tipForm" autocomplete="off">
        <div>
          <label for="bill">Bill amount</label>
          <div class="field">
            <span class="prefix">$</span>
            <input id="bill" name="bill" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="86.40" />
          </div>
        </div>

        <div>
          <label for="tip">Tip percent</label>
          <div class="field">
            <input id="tip" name="tip" type="number" inputmode="decimal" min="0" step="0.1" value="18" />
            <span class="suffix">%</span>
          </div>
          <div class="chips" role="group" aria-label="Quick tip percents">
            <button class="chip" type="button" data-tip="10">10%</button>
            <button class="chip" type="button" data-tip="15">15%</button>
            <button class="chip" type="button" data-tip="20">20%</button>
            <button class="chip" type="button" data-tip="25">25%</button>
          </div>
        </div>

        <div>
          <label for="people">Number of people</label>
          <div class="people-row">
            <button class="stepper" id="minus" type="button" aria-label="Decrease people">−</button>
            <input id="people" name="people" type="number" inputmode="numeric" min="1" step="1" value="3" />
            <button class="stepper" id="plus" type="button" aria-label="Increase people">+</button>
          </div>
        </div>
      </form>

      <p class="hint" id="hint" role="status"></p>

      <section class="results" aria-live="polite">
        <div class="result">
          <span>Tip amount</span>
          <strong id="tipAmount">$0.00</strong>
        </div>
        <div class="result">
          <span>Total</span>
          <strong id="total">$0.00</strong>
        </div>
        <div class="result total">
          <span>Per person</span>
          <strong id="perPerson">$0.00</strong>
        </div>
      </section>
    </main>
  </div>

  <script>
    const billInput = document.getElementById("bill");
    const tipInput = document.getElementById("tip");
    const peopleInput = document.getElementById("people");
    const hint = document.getElementById("hint");
    const tipAmountEl = document.getElementById("tipAmount");
    const totalEl = document.getElementById("total");
    const perPersonEl = document.getElementById("perPerson");
    const chips = [...document.querySelectorAll(".chip")];
    const themeToggle = document.getElementById("themeToggle");
    const root = document.documentElement;

    const money = (n) => n.toLocaleString(undefined, {
      style: "currency",
      currency: "USD",
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

    function parseAmount(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : NaN;
    }

    function setTheme(theme) {
      root.setAttribute("data-theme", theme);
      localStorage.setItem("tip-theme", theme);
      const dark = theme === "dark";
      themeToggle.setAttribute("aria-pressed", String(dark));
      themeToggle.setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
    }

    function initTheme() {
      const saved = localStorage.getItem("tip-theme");
      if (saved === "light" || saved === "dark") {
        setTheme(saved);
        return;
      }
      setTheme(window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    }

    function syncChips(tip) {
      chips.forEach((chip) => {
        chip.classList.toggle("active", Number(chip.dataset.tip) === tip);
      });
    }

    function calculate() {
      const bill = parseAmount(billInput.value);
      const tipPct = parseAmount(tipInput.value);
      const people = parseAmount(peopleInput.value);

      let message = "";
      if (billInput.value !== "" && (bill < 0 || Number.isNaN(bill))) message = "Enter a valid bill amount.";
      else if (tipInput.value !== "" && (tipPct < 0 || Number.isNaN(tipPct))) message = "Enter a valid tip percent.";
      else if (peopleInput.value !== "" && (!Number.isInteger(people) || people < 1)) message = "Split between at least one person.";
      hint.textContent = message;

      const safeBill = bill > 0 ? bill : 0;
      const safeTip = tipPct >= 0 ? tipPct : 0;
      const safePeople = people >= 1 ? Math.floor(people) : 1;
      const tipAmount = safeBill * (safeTip / 100);
      const total = safeBill + tipAmount;
      const perPerson = total / safePeople;

      tipAmountEl.textContent = money(tipAmount);
      totalEl.textContent = money(total);
      perPersonEl.textContent = money(perPerson);
      syncChips(safeTip);
    }

    ["input", "change"].forEach((evt) => {
      billInput.addEventListener(evt, calculate);
      tipInput.addEventListener(evt, calculate);
      peopleInput.addEventListener(evt, calculate);
    });

    chips.forEach((chip) => {
      chip.addEventListener("click", () => {
        tipInput.value = chip.dataset.tip;
        calculate();
        tipInput.focus();
      });
    });

    document.getElementById("minus").addEventListener("click", () => {
      const n = Math.max(1, Math.floor(parseAmount(peopleInput.value) || 1) - 1);
      peopleInput.value = String(n);
      calculate();
    });

    document.getElementById("plus").addEventListener("click", () => {
      const n = Math.max(1, Math.floor(parseAmount(peopleInput.value) || 0) + 1);
      peopleInput.value = String(n);
      calculate();
    });

    themeToggle.addEventListener("click", () => {
      setTheme(root.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    initTheme();
    calculate();
  </script>
</body>
</html>
